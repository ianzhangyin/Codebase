<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">毛茸茸的奶油色小猫</title>
  <desc id="desc">一只坐着微笑的蓬松奶油色小猫，带着浅粉色脸颊和紫色围巾。</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fffdf9"/><stop offset=".55" stop-color="#f8e9d5"/><stop offset="1" stop-color="#ebcfae"/></linearGradient>
    <linearGradient id="innerEar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6c6ce"/><stop offset="1" stop-color="#edabb8"/></linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d8cf4"/><stop offset="1" stop-color="#7462d9"/></linearGradient>
    <radialGradient id="cheek"><stop stop-color="#f6bdc5" stop-opacity=".78"/><stop offset="1" stop-color="#f6bdc5" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="15" stdDeviation="11" flood-color="#6657a8" flood-opacity=".16"/></filter>
  </defs>
  <ellipse cx="211" cy="384" rx="116" ry="15" fill="#9385d5" opacity=".12"/>
  <g filter="url(#shadow)" stroke="#d9b995" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- curled tail -->
    <path d="M294 333c39 13 65-4 68-32 3-24-15-41-34-37-15 4-19 20-10 29 7 7 19 4 21-5 2-6-2-11-7-12 12-3 20 8 17 20-5 19-29 26-52 12" fill="none" stroke="#e7c9a7" stroke-width="29"/>
    <path d="M294 333c39 13 65-4 68-32 3-24-15-41-34-37-15 4-19 20-10 29 7 7 19 4 21-5 2-6-2-11-7-12" fill="none" stroke="#fff4e4" stroke-width="14"/>
    <!-- body silhouette with soft fur tufts -->
    <path d="M118 344c-10-23-12-50-5-76l-14-7 16-10-4-17 19 8c8-13 19-23 32-31 24-14 56-17 84-8 18 6 34 17 46 32l17-7-3 18 15 11-17 7c6 28 1 57-13 80-8 13-21 22-38 24H157c-18-2-31-11-39-24Z" fill="url(#fur)"/>
    <!-- head silhouette -->
    <path d="m122 174-5-54 38 22c15-12 34-19 55-19s40 7 55 19l38-22-5 54c15 14 24 34 24 55 0 49-50 83-112 83s-112-34-112-83c0-21 9-41 24-55Z" fill="url(#fur)"/>
    <!-- fluffy cheek scallops -->
    <path d="M105 206c-10 4-17 12-18 22 8-2 14-1 19 3-8 4-11 11-10 18 9-4 17-3 24 2m191-45c10 4 17 12 18 22-8-2-14-1-19 3 8 4 11 11 10 18-9-4-17-3-24 2" fill="#f8ead8"/>
    <!-- inner ears -->
    <path d="m130 151-3-14 17 10m130 4 18-14-3 25" fill="none" stroke="url(#innerEar)" stroke-width="11"/>
    <!-- forehead fur and stripes -->
    <path d="M172 166c9 8 13 16 13 25m25-32c-2 11-1 19 4 27m25-20c-8 7-12 15-13 23" fill="none" stroke="#e4c6a5" stroke-width="5" opacity=".78"/>
    <path d="M127 199c10 3 17 8 22 15m-25 1c7 1 12 4 17 9m152-25c-10 3-17 8-22 15m25 1c-7 1-12 4-17 9" fill="none" stroke="#e5c8a8" stroke-width="4" opacity=".7"/>
    <!-- eyes -->
    <path d="M158 220c8-13 23-13 31 0m43 0c8-13 23-13 31 0" fill="none" stroke="#50465e" stroke-width="5"/>
    <circle cx="172" cy="222" r="2.5" fill="#50465e" stroke="none"/><circle cx="244" cy="222" r="2.5" fill="#50465e" stroke="none"/>
    <!-- cheeks -->
    <ellipse cx="146" cy="239" rx="27" ry="16" fill="url(#cheek)" stroke="none"/><ellipse cx="270" cy="239" rx="27" ry="16" fill="url(#cheek)" stroke="none"/>
    <!-- nose and smile -->
    <path d="m202 235 8-6 8 6-8 6Z" fill="#d98c9e" stroke="none"/>
    <path d="M210 241c-1 8-7 11-13 8m13-8c1 8 7 11 13 8" fill="none" stroke="#755b69" stroke-width="2.4"/>
    <!-- whiskers -->
    <path d="m143 243-29-5m29 12-30 4m147-11 29-5m-29 12 30 4" fill="none" stroke="#c49f87" stroke-width="1.7" opacity=".8"/>
    <!-- scarf -->
    <path d="M144 282c20 12 42 18 66 18s46-6 66-18l18 25c-23 19-52 29-84 29s-61-10-84-29Z" fill="url(#scarf)" stroke="#7666cf"/>
    <path d="m251 318 9 51-28-15-21 22-4-57" fill="#8170df" stroke="#7666cf"/>
    <path d="M163 299c13 6 29 10 47 10s34-4 47-10" fill="none" stroke="#c0b5ff" stroke-width="3" opacity=".8"/>
    <!-- paws -->
    <path d="M140 347c1 18 19 27 42 27 18 0 29-7 30-18 0-10-11-17-28-17h-26c-10 0-17 3-18 8Zm82 9c1 11 13 18 31 18 23 0 41-9 42-27 0-5-8-8-18-8h-27c-17 0-28 7-28 17Z" fill="#fff8ed"/>
    <path d="M165 358v7m14-8v8m67-8v8m15-7v7" fill="none" stroke="#d9b995" stroke-width="2"/>
  </g>
  <g fill="#fff" opacity=".85"><path d="m79 133 4 10 10 4-10 4-4 10-4-10-10-4 10-4Zm264 104 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/><circle cx="93" cy="286" r="3"/><circle cx="332" cy="164" r="3"/></g>
</svg>
